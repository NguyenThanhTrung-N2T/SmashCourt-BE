name: BE CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    name: Restore, Build, Test & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Chạy 236 tests (235 Unit + Integration Tests) với Logger GitHubActions & TRX
      - name: Execute Tests
        run: >
          dotnet test 
          --no-build 
          --configuration Release 
          --verbosity normal 
          --logger "GitHubActions" 
          --logger "trx;LogFileName=test_results.trx" 
          --collect:"XPlat Code Coverage" 
          --results-directory ./TestResults

      # Xuất bảng tổng hợp kết quả trực quan lên GitHub Summary
      - name: Publish Test Results Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Tests Report
          path: "TestResults/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      # Lưu trữ Artifacts kết quả test và coverage
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: be-test-results
          path: ./TestResults

      # Chỉ build Docker image khi toàn bộ tests PASS
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: smashcourt-be:ci
