name: BE CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Restore, Build, Test & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      # SEC-BE-7: package có lỗ hổng mức High/Critical (kể cả bắc cầu) hoặc không quét được ⇒ job đỏ
      - name: Check Vulnerable Packages
        run: bash tools/ci/check-vulnerable-packages.sh

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Chạy 236 tests xuất báo cáo TRX
      - name: Execute Tests
        run: >
          dotnet test 
          --no-build 
          --configuration Release 
          --verbosity normal 
          --logger "trx;LogFileName=test_results.trx" 
          --collect:"XPlat Code Coverage" 
          --results-directory ./TestResults

      # Xuất bảng tổng hợp kết quả trực quan lên GitHub Summary từ file TRX
      - name: Publish Test Results Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Tests Report
          path: "TestResults/**/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      # Lưu trữ Artifacts kết quả test và coverage
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: be-test-results
          path: ./TestResults

  # Epic 6C (6C-2a): build image MỘT lần ⇒ kiểm (không file bí mật, non-root, nhãn revision = sha) ⇒ đẩy đúng image đó lên GHCR.
  # Pull request: chỉ build + kiểm. Push master/develop: đẩy tag sha-<7> (bất biến, CD triển khai theo tag này) và tag nhánh.
  image:
    name: Docker Image (build, check, push GHCR)
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check and push image
        env:
          GIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash tools/ci/build-image.sh ghcr.io/nguyenthanhtrung-n2t/smashcourt-be ${{ github.event_name == 'push' && '--push' || '' }}

  # Epic 6C (6C-2b): CD — push develop/master ⇒ runner trên máy deploy kéo đúng image sha-<7> vừa đẩy, kiểm (đúng commit, health, smoke
  # chỉ đọc), hỏng thì tự quay về bản trước (SmashCourt-BE/deploy/cd.sh). Pull request không bao giờ chạy job này.
  deploy:
    name: Deploy (máy deploy)
    if: github.event_name == 'push'
    needs: image
    runs-on: [self-hosted, smashcourt-deploy]
    timeout-minutes: 15
    concurrency:
      group: deploy-be
      cancel-in-progress: false

    steps:
      - name: Get deploy kit (SmashCourt-BE/deploy, nhánh develop)
        uses: actions/checkout@v4
        with:
          repository: NguyenThanhTrung-N2T/SmashCourt-BE
          ref: develop
          sparse-checkout: deploy

      - name: Deploy, verify, roll back on failure
        env:
          SHA: ${{ github.sha }}
        run: bash deploy/cd.sh be "$SHA"
